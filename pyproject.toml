[project]
name = "presence-cards"
version = "1.0.1"
description = "Discord presence cards rendered as SVG"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "discord.py>=2.7.1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presence_cards"]

[tool.ruff.lint]
select = ["N"]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
